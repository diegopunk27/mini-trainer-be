services:
  postgresdb:
    profiles: ['postgres']
    image: postgres:16
    ports:
      - ${POSTGRES_HOST_PORT:-5432}:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root_password
      POSTGRES_DB: mini_trainer_dev
    volumes:
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: mini_trainer
      MINIO_ROOT_PASSWORD: mini_trainer_secret
    restart: always

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  app:
    image: app-dev
    build:
      context: .
      dockerfile: ./dockerfile.development
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
